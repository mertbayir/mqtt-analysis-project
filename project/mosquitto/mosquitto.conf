# Mosquitto 2.x varsayılan olarak yalnızca localhost'tan bağlantı kabul eder.
# Başka konteynerlerden (sanal cihazlar) bağlanabilmek için dinleyici açıyoruz.
listener 1883
allow_anonymous true

# Adım 5 (bağlantı sonrası yük): toplayıcı istemci, boşaltma anında çok sayıda mesajı peş peşe alır.
# Varsayılan sınır (istemci başına 1.000 kuyruklu mesaj) aşılırsa sunucu mesaj DÜŞÜRÜR ve ölçüm bozulur.
# Bu yüzden kuyruk sınırsız (0). Önceki adımlarda (1-4) iş yükü olmadığı için bu ayarın etkisi yoktu.
max_queued_messages 0
max_inflight_messages 100

# Adım 6 (TLS): cihazlar 8883'e TLS ile bağlanır; 1883 (TLS'siz) önceki adımlar ve toplayıcı için kalır.
# Sertifikalar scripts/tls_sertifika.sh ile üretilir (atılabilir test sertifikası, git dışı).
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
